<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FeelFamous Basecamp — Outward Beacon</title>
<script src="qrcode.js"></script>
<style>
  @font-face{font-family:'Crimson Pro';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/CrimsonPro-300.ttf') format('truetype')}
  @font-face{font-family:'Crimson Pro';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/CrimsonPro-600.ttf') format('truetype')}
  @font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/SpaceMono-400.ttf') format('truetype')}
  @font-face{font-family:'Space Mono';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/SpaceMono-700.ttf') format('truetype')}

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none;user-select:none}
  body{
    font-family:'Crimson Pro',Georgia,serif;
    display:flex;align-items:center;justify-content:center;
  }

  .slide{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#000;color:#fff;
    opacity:0;visibility:hidden;
    transition:opacity 1s ease;
    padding:4vh 4vw;text-align:center;
  }
  .slide.active{opacity:1;visibility:visible}

  .eyebrow{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:clamp(1.4rem,3.4vw,2.6rem);
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:#f0b830;
    margin-bottom:3vh;
  }

  .headline{
    font-weight:600;
    font-size:clamp(3rem,8vw,7rem);
    line-height:1.05;
    margin-bottom:3vh;
  }
  .headline em{font-style:italic;color:#f0b830}

  .qr-wrap{
    background:#fff;
    padding:2.2vw;
    border-radius:1.2vw;
    display:inline-block;
    margin-bottom:3vh;
  }
  .qr-wrap canvas,.qr-wrap img{display:block;width:min(42vh,42vw);height:min(42vh,42vw)}

  .subline{
    font-family:'Space Mono',monospace;
    font-size:clamp(1.2rem,2.6vw,2rem);
    letter-spacing:0.08em;
    color:#e8e0d0;
  }
  .subline strong{color:#f0b830}

  .message{
    font-style:italic;
    font-size:clamp(2.6rem,6vw,5.5rem);
    line-height:1.3;
    max-width:90vw;
    color:#fff;
  }

  .flame{font-size:clamp(3rem,6vw,5rem);margin-bottom:2vh}

  .dots{position:fixed;bottom:4vh;left:0;right:0;display:flex;gap:1.4vh;justify-content:center;z-index:10}
  .dot{width:1.4vh;height:1.4vh;border-radius:50%;background:#3a3a3a;transition:background .3s}
  .dot.active{background:#f0b830}
</style>
</head>
<body>

<!-- Slide 1: join the wifi -->
<div class="slide active" data-slide="0">
  <div class="eyebrow">Step 1 — Join the Wi-Fi</div>
  <div class="qr-wrap"><div id="qr-wifi"></div></div>
  <div class="subline">Scan to connect &middot; no password needed*</div>
</div>

<!-- Slide 2: open the page -->
<div class="slide" data-slide="1">
  <div class="eyebrow">Step 2 — Say Hi</div>
  <div class="qr-wrap"><div id="qr-page"></div></div>
  <div class="subline">Scan to open <strong>FeelFamous Basecamp</strong></div>
</div>

<!-- Slide 3: rotating welcome message -->
<div class="slide" data-slide="2">
  <div class="flame">🔥</div>
  <div class="message" id="rotating-message">Free wifi. No signup. No data harvested.</div>
</div>

<div class="dots">
  <div class="dot active" data-dot="0"></div>
  <div class="dot" data-dot="1"></div>
  <div class="dot" data-dot="2"></div>
</div>

<script>
/* ====================================================================
   CONFIG — fill these in once the SSID is set on the RavPower device.
   The wifi QR uses the standard WIFI: URI scheme, which iOS and
   Android both recognise natively (Camera app / QR scanner) to join
   the network directly — no app required, no captive portal needed.
   ==================================================================== */
  const WIFI_SSID     = 'FeelFamous-Basecamp'; // TODO: confirm actual SSID broadcast by the RavPower device
  const WIFI_PASSWORD = '';                    // TODO: leave blank only if the network is genuinely open
  const WIFI_AUTH     = 'nopass';              // 'nopass' | 'WPA' | 'WEP'
  const BASECAMP_URL  = 'http://10.10.10.254/basecamp/index.html';
/* ==================================================================== */

  function escapeWifi(s) {
    return String(s).replace(/([\\;,:"])/g, '\\$1');
  }

  const wifiString = WIFI_AUTH === 'nopass'
    ? `WIFI:T:nopass;S:${escapeWifi(WIFI_SSID)};;`
    : `WIFI:T:${WIFI_AUTH};S:${escapeWifi(WIFI_SSID)};P:${escapeWifi(WIFI_PASSWORD)};;`;

  new QRCode(document.getElementById('qr-wifi'), {
    text: wifiString,
    width: 480, height: 480,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  new QRCode(document.getElementById('qr-page'), {
    text: BASECAMP_URL,
    width: 480, height: 480,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  document.querySelector('.slide[data-slide="0"] .subline').innerHTML =
    'Scan to connect' + (WIFI_AUTH === 'nopass' ? ' &middot; open network, no password' : ' &middot; password protected');

  /* ---- rotating welcome micro-messages (slide 3) ---- */
  const messages = [
    'Free wifi. No signup. No data harvested.',
    'Come say hi. No pressure, no pitch.',
    'Pull up a chair. The kettle’s on.',
    'Just trying to be useful. One ember at a time.'
  ];
  let msgIndex = 0;
  function nextMessage() {
    msgIndex = (msgIndex + 1) % messages.length;
    document.getElementById('rotating-message').textContent = messages[msgIndex];
  }

  /* ---- slide rotation ---- */
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  let current = 0;
  const SLIDE_SECONDS = 9;

  function showSlide(i) {
    slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
    dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
    if (i === 2) nextMessage();
  }

  setInterval(() => {
    current = (current + 1) % slides.length;
    showSlide(current);
  }, SLIDE_SECONDS * 1000);
</script>
</body>
</html>
